[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minemembench"
version = "0.1.0"
description = "Reproducible benchmark for evaluating long-term memory frameworks on embodied LLM agents in Minecraft"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
# The `mem0` memory backend (M8). Kept optional so the core package and tests
# run without the heavy SDK; the adapter imports mem0 lazily.
mem0 = [
    "mem0ai>=2.0.17,<3",
]
# The `graphiti` memory backend (M10): temporal knowledge graph on embedded
# Kuzu. `sentence-transformers` (and its torch stack) is only needed for live
# embedding; the adapter imports graphiti-core lazily, and the core package and
# tests run without it.
graphiti = [
    "graphiti-core>=0.29,<1",
    "kuzu>=0.11,<1",
    "sentence-transformers>=3",
]
# Charts for the M11 report (`minemembench report`). Matplotlib is imported
# lazily inside write_charts; the report command explains how to install it.
report = [
    "matplotlib>=3.9",
]

[project.scripts]
minemembench = "minemembench.cli:main"

# The package source lives under benchmark/minemembench but ships as the
# top-level `minemembench` package.
[tool.hatch.build.targets.wheel]
packages = ["benchmark/minemembench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["benchmark/tests"]
